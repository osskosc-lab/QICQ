name: QICQ additional tests (non-frozen)

# Added 2026-10-24. Does not replace or alter any frozen qualification workflow.
on:
  pull_request:
    paths:
      - 'simulations/**'
      - 'scripts/**'
      - '.github/workflows/qicq-additional-tests.yml'
  workflow_dispatch:

jobs:
  hqc-tests-and-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r simulations/requirements-lock.txt
      - name: H_QC design-audit unit tests
        run: python -m unittest simulations.test_hqc_phase1_design_audit -v
      - name: Run-twice determinism check (H_QC)
        run: |
          python simulations/hqc_phase1_design_audit.py --reps 3000 --seed 20260809 --outdir run1/hqc_phase1_design_audit
          python simulations/hqc_phase1_design_audit.py --reps 3000 --seed 20260809 --outdir run2/hqc_phase1_design_audit
          python scripts/compare_runs.py run1 run2
