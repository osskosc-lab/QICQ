name: H_QC Phase 1 Design Audit

on:
  push:
    branches:
      - hqc-phase1-xenon-replication
  pull_request:
    paths:
      - 'preregistration/**'
      - 'simulations/**'
      - 'requirements.txt'
      - '.github/workflows/hqc-phase1-design-audit.yml'
  workflow_dispatch:

jobs:
  design-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run frozen synthetic falsification audit
        run: |
          python simulations/hqc_phase1_design_audit.py --reps 3000 --seed 20260809

      - name: Display operating characteristics
        run: |
          cat artifacts/hqc_phase1_design_audit/operating_characteristics.csv

      - name: Upload design-audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hqc-phase1-design-audit
          path: artifacts/hqc_phase1_design_audit/
