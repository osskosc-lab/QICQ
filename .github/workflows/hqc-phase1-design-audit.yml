name: H_QC Phase 1 Design Audit

on:
  push:
    branches:
      - hqc-phase1-xenon-replication
      - main
  pull_request:
    paths:
      - 'preregistration/**'
      - 'simulations/**'
      - 'requirements.txt'
      - 'simulations/requirements-lock.txt'
      - '.github/workflows/hqc-phase1-design-audit.yml'
  workflow_dispatch:

jobs:
  design-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install exact dependencies (simulations/requirements-lock.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r simulations/requirements-lock.txt

      - name: Record environment
        run: |
          python --version
          python -c "import numpy, scipy; print('numpy', numpy.__version__); print('scipy', scipy.__version__)"

      - name: Run design-audit unit tests
        run: |
          python simulations/test_hqc_phase1_design_audit.py

      - name: Run frozen synthetic falsification audit
        run: |
          python simulations/hqc_phase1_design_audit.py --reps 3000 --seed 20260809

      - name: SD sensitivity (informational; v1.2 section 16b; does not gate CI)
        run: |
          python simulations/hqc_phase1_design_audit.py --reps 3000 --seed 20260809 --residual-sd 7 --outdir artifacts/hqc_phase1_design_audit/sensitivity_sd7_b20 --allow-check-failure
          python simulations/hqc_phase1_design_audit.py --reps 3000 --seed 20260809 --residual-sd 7 --n-blocks 22 --outdir artifacts/hqc_phase1_design_audit/sensitivity_sd7_b22 --allow-check-failure

      - name: Display operating characteristics
        run: |
          cat artifacts/hqc_phase1_design_audit/operating_characteristics.csv

      - name: Upload design-audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hqc-phase1-design-audit
          path: artifacts/hqc_phase1_design_audit/
